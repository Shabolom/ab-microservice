syntax = "proto3";

package platform.mvp;
option go_package = "gen/auth/v1;authv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ABExperiment {
  rpc UserExperiment(ExperimentRequest) returns (ExperimentsReply) {}

  rpc CreateExperiment(CreateExperimentRequest) returns (StockReply) {}
  rpc CreateNamespace(CreateNamespaceRequest) returns (StockReply) {}
  rpc CreateLayer(CreateLayerRequest) returns (StockReply) {}
  rpc SetReadyExperiment(SetReadyExperimentRequest) returns (StockReply) {}
  rpc SetStopedExperiment(SetStopedExperimentRequest) returns (StockReply) {}
  rpc CreateCustomParam(CreateCustomParamRequest) returns (StockReply) {}
  rpc CreateFeatureToggle(CreateFeatureToggleRequest) returns (StockReply) {}
  rpc UpdateFeatureToggleRollout(UpdateFeatureToggleRolloutRequest) returns (StockReply) {}
  rpc SetFeatureToggleStatus(SetFeatureToggleStatusRequest) returns (StockReply) {}
  rpc IsFeatureEnabled(IsFeatureEnabledRequest) returns (StockReply) {}
  rpc IsUserInFeature(IsUserInFeatureRequest) returns (IsUserInFeatureReply) {}

  rpc GetExperimentByID(GetExperimentByIDRequest) returns (GetExperimentByIDReply) {}
  rpc GetNamespaceByID(GetNamespaceByIDRequest) returns (GetNamespaceByIDReply) {}
  rpc GetLayerByID(GetLayerByIDRequest) returns (GetLayerByIDReply) {}
  rpc GetCustomParamByID(GetCustomParamByIDRequest) returns (GetCustomParamByIDReply) {}
  rpc GetFeatureToggleByID(GetFeatureToggleByIDRequest) returns (GetFeatureToggleByIDReply) {}

  rpc GetExperiments(google.protobuf.Empty) returns (GetExperimentsReply) {}
  rpc GetNamespaces(google.protobuf.Empty) returns (GetNamespaceBysReply) {}
  rpc GetLayers(google.protobuf.Empty) returns (GetLayerBysReply) {}
  rpc GetCustomParams(google.protobuf.Empty) returns (GetCustomParamBysReply) {}
  rpc GetFeatureToggles(google.protobuf.Empty) returns (GetFeatureToggleBysReply) {}
}

message StockReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
}

message GetExperimentByIDRequest {
  int64 id = 1;
}

message GetExperimentByIDReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  Experiment experiment = 3;
}

message GetNamespaceByIDRequest {
  int64 id = 1;
}

message GetNamespaceByIDReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  Namespace namespace = 3;
}

message GetLayerByIDRequest {
  int64 id = 1;
}

message GetLayerByIDReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  Layer layer = 3;
}

message GetCustomParamByIDRequest {
  int64 id = 1;
}

message GetCustomParamByIDReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  CustomParam custom_param = 3;
}

message GetFeatureToggleByIDRequest {
  int64 id = 1;
}

message GetFeatureToggleByIDReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  FeatureToggle feature_toggle = 3;
}

message GetExperimentsReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  repeated Experiment experiments = 3;
}

message GetNamespaceBysReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  repeated Namespace namespaces = 3;
}

message GetLayerBysReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  repeated Layer layers = 3;
}

message GetCustomParamBysReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  repeated CustomParam custom_params = 3;
}

message GetFeatureToggleBysReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  repeated FeatureToggle feature_toggles = 3;
}

message Experiment {
  int64 id = 1;
  string name = 2;
  string namespace = 3;
  string status = 4;
  int64 rollout_percentage = 5;
  google.protobuf.Timestamp start_date = 6;
  google.protobuf.Timestamp end_date = 7;
  repeated string passing_cities = 8;
  repeated string excluded_cities = 9;
  repeated string passing_stores = 10;
  repeated string excluded_stores = 11;
  repeated int64 layers_id = 12;
  repeated ParamGroup params_groups = 13;
  repeated Group groups = 14;
}

message Namespace {
  int64 id = 1;
  string name = 2;
  string description = 3;
}

message Layer {
  int64 id = 1;
  int64 namespace_id = 2;
  string name = 3;
  string description = 4;
}

message CustomParam {
  int64 id = 1;
  int64 namespace_id = 2;
  string name = 3;
  string type = 4;
}

message FeatureToggle {
  int64 id = 1;
  int64 namespace_id = 2;
  string name = 3;
  string status = 4;

  optional int64 rollout_percentage = 5;
  optional int64 ios = 6;
  optional int64 android = 7;
  optional int64 web = 8;

  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp deleted_at = 11;
}

message Feature {
  int64 feature_id = 1;
  string feature_name = 2;
}

message IsUserInFeatureReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  repeated Feature features = 3;
}

message CreateExperimentRequest {
  string name = 1;
  int64 rollout_percentage = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
  repeated int64 layers_id = 5;
  repeated string passing_cities = 6;
  repeated string excluded_cities = 7;
  repeated string passing_stores = 8;
  repeated string excluded_stores = 9;
  repeated Group groups = 10;
  repeated CustomParamGroup custom_param_groups = 11;
}

message CustomParamGroup {
  int64 percent = 1;
  repeated CustomParamWithCondition params_with_conditions = 2;
}

message CustomParamCondition {
  int64 parameter_id = 1;
  string condition = 2;
  string value = 3;
}

message ParamGroup {
  int64 id = 1;
  int64 percent = 2;
  repeated CustomParamWithCondition params_with_conditions = 3;
}

message CustomParamWithCondition {
  int64 id = 1;
  int64 parameter_id = 2;
  int64 parameter_group_id = 3;
  string value = 4;
  string condition = 5;
}

message Group {
  int64 id = 1;
  string name = 2;
  int64 rolling_percentage = 3;
  repeated int64 device_id = 4;
}

message CreateNamespaceRequest {
  string name = 1;
  string description = 2;
}

message CreateLayerRequest {
  int64 namespace_id = 1;
  string name = 2;
  string description = 3;
}

message SetReadyExperimentRequest {
  int64 experiment_id = 1;
}

message SetStopedExperimentRequest {
  int64 experiment_id = 1;
}

message CreateCustomParamRequest {
  string name = 1;
  int64 namespace_id = 2;
  string type = 3;
}

message CreateFeatureToggleRequest {
  string name = 1;
  int64 namespace_id = 2;

  optional int64 ios_rollout_percentage = 3;
  optional int64 android_rollout_percentage = 4;
  optional int64 web_rollout_percentage = 5;
  optional int64 rollout_percentage = 6;
}

message UpdateFeatureToggleRolloutRequest {
  int64 feature_toggle_id = 1;

  optional int64 ios_rollout_percentage = 2;
  optional int64 android_rollout_percentage = 3;
  optional int64 web_rollout_percentage = 4;
  optional int64 rollout_percentage = 5;
}

message SetFeatureToggleStatusRequest {
  int64 feature_toggle_id = 1;
  string status = 2;
}

message IsFeatureEnabledRequest {
  int64 feature_toggle_id = 1;
}

message IsUserInFeatureRequest {
  int64 user_id = 1;
  string namespace = 2;
  string platform = 3;
}

message ExperimentRequest {
  int64 split_id = 1;
  int64 device_id = 2;
  string namespace = 3;
  string city = 4;
  string store = 5;
  repeated Param params = 6;
}

message Param {
  string param_name = 1;
  string value = 2;
}

message ExperimentsReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
  repeated ExperimentReply experiments_reply = 3;
}

message ExperimentReply {
  string experiment_name = 1;
  string group_name = 2;
}