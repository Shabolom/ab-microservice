syntax = "proto3";

package platform.mvp;
option go_package = "gen/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

service ABExperiment {
  rpc UserExperiment(ExperimentRequest) returns (ExperimentsReply) {}
  rpc CreateExperiment(CreateExperimentRequest) returns (StockReply) {}
  rpc CreateNamespace(CreateNamespaceRequest) returns (StockReply) {}
  rpc CreateLayer(CreateLayerRequest) returns (StockReply) {}
  rpc SetReadyExperiment(SetReadyExperimentRequest) returns (StockReply) {}
  rpc SetStopedExperiment(SetStopedExperimentRequest) returns (StockReply) {}
}

message StockReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }
  ERR_INFO_REASON err_info_reason = 1;
  string message = 2;
}

message CreateExperimentRequest {
  string name = 1;
  int64 rollout_percentage = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
  repeated int64 layers_id = 5;
  repeated string passing_cities = 6;
  repeated string excluded_cities = 7;
  repeated string passing_stores = 8;
  repeated string excluded_stores = 9;
  repeated Group groups = 10;
}

message Group {
  string name = 2;
  int64 rolling_percentage = 3;
  repeated int64 device_id = 4;
}

message CreateNamespaceRequest {
  string name = 1;
  string description = 2;
}

message CreateLayerRequest {
  int64 namespace_id = 1;
  string name = 2;
  string description = 3;
}

message SetReadyExperimentRequest {
  int64 experiment_id = 1;
}

message SetStopedExperimentRequest {
  int64 experiment_id = 1;
}

message ExperimentRequest {
  int64 split_id = 1;
  int64 device_id = 2;
  string namespace = 3;
  string city = 4;
  string store = 5;
}

message ExperimentsReply {
  enum ERR_INFO_REASON {
    UNSPECIFIED = 0;
    VALIDATION_ERROR = 1;
    INVALID_REQUEST = 2;
    STATUS_OK = 3;
  }

  ERR_INFO_REASON err_info_reason = 1;
  repeated ExperimentReply experiments_reply = 2;
}

message ExperimentReply {
  string experiment_name = 1;
  string group_name = 2;
}