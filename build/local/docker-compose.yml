version: '3.9'

name: ab

services:
  postgres:
    image: postgres:16
    container_name: ab-postgres
    restart: always
    environment:
      POSTGRES_DB: ab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ab-db-network

  prometheus:
    image: prom/prometheus:latest
    container_name: ab-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ab-db-network

  grafana:
    image: grafana/grafana:latest
    container_name: ab-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
    networks:
      - ab-db-network

  loki:
    image: grafana/loki:latest
    container_name: ab-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ab-db-network

  alloy:
    image: grafana/alloy:latest
    container_name: ab-alloy
    restart: always
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - /etc/alloy/config.alloy
    networks:
      - ab-db-network

volumes:
  postgres_data:
  grafana_data:

networks:
  ab-db-network:
    driver: bridge

  shared-kafka-network:
    external: true
    name: shared-kafka-network