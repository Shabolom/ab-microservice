version: '3.9'

name: ab

services:
  postgres:
    image: postgres:16
    container_name: ab-postgres
    restart: always
    environment:
      POSTGRES_DB: ab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ab-db-network

volumes:
  postgres_data:

networks:
  ab-db-network:
    driver: bridge

  shared-kafka-network:
    external: true
    name: shared-kafka-network